[package]
name = "discordscript"
version = "0.1.0"
edition = "2021"
description = "DiscordScript - A super easy Discord bot programming language"

[dependencies]
clap = { version = "4", features = ["derive"] }
serenity = { version = "0.12", default-features = false, features = ["rustls_backend", "gateway", "model", "builder", "voice"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rand = "0.8"
url = "2"
comfy-table = "7"
tower-http = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
notify = "6"
colored = "2"
walkdir = "2"
zip = "0.6"
